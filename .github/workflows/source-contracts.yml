name: Pythonic source contracts

on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonic-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the native course interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install the unchanged pinned development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Identify interpreter and checker
        run: |
          python --version
          python -m mypy --version
          python -m pip check
      - name: Verify all thirty-one source families
        env:
          COURSE_PYTHON: python
        run: bash verify-course-source.sh
